<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEE PDF to CBT Setup</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Setup Screen: Upload PDF and Enter Answer Key -->
    <div id="setup-screen" class="container setup-container">
        <h1>Create CBT from PDF</h1>
        
        <label>Upload Test PDF:</label>
        <input type="file" id="pdf-upload" accept="application/pdf">
        
        <label>Test Name (e.g., Mini Test 1):</label>
        <input type="text" id="test-name" placeholder="Enter test name">
        
        <label>Number of Questions:</label>
        <input type="number" id="num-questions" value="20" min="1" max="75">

        <label>Number of Questions:</label>
        <input type="number" id="num-questions" value="20" min="1" max="75">
        
        <label>Test Duration (in minutes):</label>
        <input type="number" id="test-duration" value="60" min="1" max="300">
        
        <label>Answer Key (e.g., A,B,C,D... separated by commas):</label>
        
        <label>Answer Key (e.g., A,B,C,D... separated by commas):</label>
        <textarea id="answer-key" placeholder="A,B,C,D,A,A,B..."></textarea>
        
        <button onclick="startTest()">Start CBT Mode</button>
    </div>

    <!-- CBT Screen: Left side PDF, Right side Digital OMR -->
    <div id="cbt-screen" class="container cbt-container hidden">
        
        <!-- Left Side: PDF Viewer -->
        <div class="pdf-viewer">
            <iframe id="pdf-frame" src=""></iframe>
        </div>
        
        <!-- Right Side: Digital OMR & Timer -->
        <div class="omr-section">
            <div class="header">
                <h2 id="display-test-name">Test Name</h2>
                <div class="timer" id="timer">01:00:00</div>
            </div>
            
            <div class="omr-grid" id="omr-grid">
                <!-- Buttons generated by JS -->
            </div>
            
            <button class="submit-btn" onclick="submitTest()">Submit Test</button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="container result-container hidden">
        <h2>Test Submitted Successfully!</h2>
        <p>Your Score: <span id="final-score"></span> / <span id="max-score"></span></p>
        <p>Correct: <span id="correct-count"></span> | Incorrect: <span id="incorrect-count"></span></p>
        <p id="firebase-status" style="color: green; font-size: 0.9em;"></p>
        <button onclick="location.reload()">Take Another Test</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
